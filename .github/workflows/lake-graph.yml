name: Lake level graph

on:
  schedule:
    - cron: "17 * * * *"      # every hour at :17 (UTC)
  workflow_dispatch:           # "Run workflow" button for testing

permissions:
  contents: write              # keepalive commit
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install matplotlib requests

      - name: Draw graph
        env:
          USGS_API_KEY: ${{ secrets.USGS_API_KEY }}
        run: python make_graph.py site/thurmond.png

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4

  # GitHub pauses scheduled workflows after 60 days with no repo activity.
  # A tiny commit on the 1st of each month keeps the hourly job alive.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Monthly keepalive commit
        run: |
          if [ "$(date -u +%d%H)" = "0100" ]; then
            date -u > keepalive.txt
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add keepalive.txt
            git commit -m "keepalive" && git push
          fi

